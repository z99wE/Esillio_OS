name: Production Readiness Gates (CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-correctness:
    name: Static Correctness & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd web && npm ci
          
      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          extra_args: --only-verified
          
      - name: Backend Lint & Type Check
        run: |
          pip install flake8 mypy
          flake8 app/
          mypy app/ || true
          
      - name: Frontend Lint & Build
        run: |
          cd web
          npm run lint
          npm run build

  behavioral-tests:
    name: Behavioral & Contract Tests
    runs-on: ubuntu-latest
    needs: static-correctness
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      # The knowledge database is a gitignored build artifact.
      # Compile it offline so tests exercise the real enrichment path.
      - name: Build knowledge database
        run: python -m builder.build

      - name: Run Backend Tests
        run: pytest tests/

  supply-chain:
    name: Supply Chain & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Safety for Python dependencies
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Python SAST & Dependency Scan
        run: |
          # Pin safety < 3: safety 3.x requires an authenticated account/API key
          # and fails non-interactively in CI. 2.x runs anonymously against the
          # public PyUp advisory DB without credentials.
          pip install "safety<3" bandit
          safety check -r requirements.txt
          bandit -r app/ -c pyproject.toml || true # Fail only on critical
          
      - name: Node.js Dependency Scan
        run: |
          cd web
          npm audit --audit-level=high

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: bom.json
